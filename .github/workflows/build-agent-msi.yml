name: Build & Sign Agent MSI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-msi:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install WiX
        run: |
          dotnet tool install --global wix --version 4.0.5
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Decode signing certificate
        env:
          PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "ECA-CodeSign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:PFX_BASE64))
          "PFX_PATH=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build & sign MSI
        working-directory: agent-csharp/EcaAgentSetup
        env:
          PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: .\build-msi.ps1 -PfxPath "$env:PFX_PATH" -PfxPassword "$env:PFX_PASSWORD"

      - name: Cleanup certificate
        if: always()
        run: |
          if ($env:PFX_PATH -and (Test-Path $env:PFX_PATH)) {
              Remove-Item $env:PFX_PATH -Force -ErrorAction SilentlyContinue
          }

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: EcaAgent-msi
          path: agent-csharp/EcaAgentSetup/EcaAgent.msi

      - name: Attach MSI to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: agent-csharp/EcaAgentSetup/EcaAgent.msi
